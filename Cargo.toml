[package]
name = "bitforce"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stitzed/bitforce"

[dependencies]
derive_more = { version = "2.1.1", features = ["into"] }
primitive-buffer = "0.1.0"
thiserror = "2.0.18"

[dev-dependencies]
criterion = "0.8.2"

[profile.test]
inherits = "release"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[bench]]
name = "nps"
harness = false
